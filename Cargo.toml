[package]
name = "rinha-2026"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rinha-2026"
path = "src/main.rs"

[[bin]]
name = "preprocess"
path = "src/bin/preprocess.rs"

[[bin]]
name = "quality_check"
path = "src/bin/quality_check.rs"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.20", features = ["derive"] }

hyper = { version = "1.5", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1.7"
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "net", "macros", "io-util", "signal"] }
memmap2 = "0.9"
simd-json = "0.14"

flate2 = "1.0"
rand = "0.8"
rayon = "1.10"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
